# The glyphplot workspace: the core and the charts, the wasm-bindgen boundary
# and the terminal, one version (REQ-ARCH-060).
[workspace]
resolver = "2"
members = ["crates/glyphplot", "crates/wasm", "crates/cli"]
# Discovery's measurements are throwaway standalone crates with their own
# `[workspace]` tables; they are never members.
exclude = ["discovery"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/curtisault/glyphplot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# Lean, as ADR-130 measured it.
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Size first, abort on panic (the contract test is the guard). `z` over
# unicel's `s`: the line module 177,385 B gzipped against 191,283 B, and in
# Node 26 its 1M-point frames 7–9 % faster, its 100k-point frames at
# 320 × 120 up to 10 % slower, all far inside REQ-PERF-060 (Phase 3,
# `mise run size`; best of 3 runs of 300 frames, load 12–15).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# A release build that keeps its function names, for size attribution.
[profile.size-names]
inherits = "release"
strip = false

# What `mise run test:rust` builds the tests with (ADR-127, REQ-BUILD-070):
# optimised, so budgets mean something, without LTO, so an edit relinks in
# about a second. Test harnesses unwind whatever the inherited `panic` says.
[profile.contract]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
debug-assertions = false
