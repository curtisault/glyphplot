[package]
name = "glyphplot-wasm"
description = "glyphplot's wasm-bindgen boundary, built once a chart family"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glyphplot = { path = "../glyphplot", default-features = false }
wasm-bindgen = "0.2"

# The core's families, mirrored (REQ-ARCH-040), and `debug` for the debug
# build: the panic hook and the `debug-panic` chart (REQ-WASM-060), which a
# release module never has. `mise run build:wasm:debug` builds `all debug`.
[features]
default = ["all"]
all = ["line", "candles", "bar"]
line = ["glyphplot/line"]
candles = ["glyphplot/candles"]
bar = ["glyphplot/bar"]
debug = []

# REQ-BUILD-050.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
