[package]
name = "glyphplot"
description = "Interactive charts drawn in Unicode glyphs, one code point and one colour a cell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# One feature a chart family, each one wasm module (REQ-ARCH-040). `all`, the
# default, turns on every family; `mise run build:wasm` builds each alone.
[features]
default = ["all"]
all = ["line"]
line = []
