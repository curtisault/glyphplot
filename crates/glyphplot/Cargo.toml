[package]
name = "glyphplot"
description = "Interactive charts drawn in Unicode glyphs, one code point and one colour a cell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# One feature a chart family, each one wasm module (REQ-ARCH-040). `all`, the
# default, turns on every family; `mise run build:wasm` builds each alone.
# `text` reads data from JSON text (`Data::from_json`, a descriptor's
# `values`): on by default for the CLI, native users and the tests, off in the
# wasm chart modules, which take typed arrays (REQ-DATA-050).
[features]
default = ["all", "text"]
all = ["line", "candles", "bar"]
line = []
candles = []
bar = []
text = []
# Three broken charts the contract must reject, in a `selftest` family
# (REQ-CONTRACT-060): for `cargo test --features contract-selftest --test
# contract selftest` only, never in a default or wasm build.
contract-selftest = ["line"]

# The core's only normal dependencies (REQ-ARCH-010).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
