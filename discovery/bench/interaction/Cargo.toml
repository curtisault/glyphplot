[package]
name = "interaction-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway: what a pointer move costs (discovery/interaction.md). Not part of glyphplot."

# Standalone: not a member of any workspace above it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "interaction-bench"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
