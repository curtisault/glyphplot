# Throwaway (discovery/testing.md): fixtures, ports and property tests to
# measure what glyphplot's tests would cost. Not glyphplot code.
[package]
name = "glyphplot-testing-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
proptest = ["dep:proptest"]
quickcheck = ["dep:quickcheck"]
# Ports d3's Math.round as Rust's f64::round, to show what the fixture test catches.
naive-round = []

[dependencies]
proptest = { version = "=1.12.0", optional = true }
quickcheck = { version = "=1.1.0", optional = true }

# unicel's release profile (../animate-unicode/Cargo.toml): `cargo test
# --release` builds with it, LTO included.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
