<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyphplot</title>
<meta name="description" content="Interactive charts drawn in Unicode glyphs: documentation with live charts, and a gallery of examples.">
<meta name="color-scheme" content="light dark">
<script>
  // The reader's theme choice before the first paint (REQ-SITE-060); without
  // one the page follows prefers-color-scheme. site/src/main.ts keeps it.
  try {
    var theme = localStorage.getItem("glyphplot-theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
</script>
<script type="module" src="./src/main.ts"></script>
</head>
<body>
<noscript><p>glyphplot's site and its charts need JavaScript. The plain checklist page is <a href="./test.html">test.html</a>.</p></noscript>
</body>
</html>
