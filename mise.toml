# Tooling for glyphplot. `mise install` puts every tool below on the path;
# `mise run <task>` is the one entry point for building, checking and serving.
# The tools are pinned as unicel's (../animate-unicode/mise.toml) pins them.
#
#   mise install          the toolchain
#   mise run check        lint, test, build and size: green before every commit
#   mise run signoff      the CI, run locally: each open pull request, or a revision
#
# `mise tasks` lists every task.

[tools]
# The charts, the wasm modules and the CLI. `targets` adds the wasm32 target
# alongside the host's, and `components` the lint tools; rust-toolchain.toml
# says the same for plain rustup.
rust = { version = "1.97", targets = "wasm32-unknown-unknown", components = "rustfmt,clippy" }
# Runs wasm-bindgen's output in tests, the TS shell's build and the site's dev server.
node = "26"
# The site.
elm = { version = "0.19.1", bin = "elm" }
# cargo build + wasm-bindgen + wasm-opt in one step. A prebuilt binary from aqua
# (the project moved to drager/wasm-pack); it downloads its own binaryen.
"aqua:drager/wasm-pack" = "0.15.0"
# Inspecting a built module: `wasm-tools print`, `objdump`, sizes.
wasm-tools = "latest"
# elm-format from its GitHub releases, not npm (unicel's mise.toml says why).
"github:avh4/elm-format" = "0.8.8"
# elm-test pinned: npm's `latest` is a prerelease, mise's `latest` an old 0.19.0.
"npm:elm-test" = "0.19.1-revision17"
# Python scripts with pinned dependencies and no install (fonts, tables, datasets).
"aqua:astral-sh/uv" = "0.12.23"
# Reruns a build when files change: `mise run dev` (scripts/dev.sh).
watchexec = "2.8.0"

[tasks.install]
description = "The toolchain mise.toml pins, the npm packages and Playwright's Chromium"
run = ["mise install", "mise run install:web", "mise run install:chromium"]

[tasks."build:wasm"]
description = "One release wasm module a chart family into web/pkg, with modules.js, budgets.json and sizes.json, staged and swapped in whole. web/pkg is shared with dev: this (and test, test:site, size, check) swaps the release build in over dev's debug one, and dev's pages reload onto it until the next change under crates/"
run = "bash scripts/build-wasm.sh"

[tasks."build:wasm:debug"]
description = "One debug module, `all` (every family and `debug`), built in target/wasm-debug, staged beside web/pkg and swapped in whole (REQ-BUILD-040); `-- --out <dir>` builds into <dir> instead"
run = "bash scripts/build-wasm.sh --debug"

[tasks."build:web-debug"]
description = "The Node tests' debug build: the debug module straight into target/web-debug/pkg (web/pkg untouched), built beside the release one"
hide = true
run = "bash scripts/build-wasm.sh --debug --out target/web-debug/pkg"

[tasks."install:web"]
description = "The web package's pinned npm packages (TypeScript), skipped while web/package-lock.json is unchanged"
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]
run = "npm ci --prefix web"

[tasks."install:site"]
description = "The site's pinned npm packages (Vite, Playwright, axe-core), skipped while site/package-lock.json is unchanged"
sources = ["site/package.json", "site/package-lock.json"]
outputs = ["site/node_modules/.package-lock.json"]
run = "npm ci --prefix site"

[tasks."install:chromium"]
description = "Playwright's headless Chromium for the browser tests and the benches (a no-op once installed)"
depends = ["install:site"]
dir = "site"
run = "npx playwright install chromium"

[tasks."build:site"]
description = "site/ built by Vite into site/dist over the release wasm in web/pkg: test.html, blank.html, the bench pages (bench/render.html, web.html, load.html)"
depends = ["install:site", "build:wasm"]
dir = "site"
run = "npx vite build --logLevel warn"

[tasks.dev]
description = "The debug build served with the checklist page (localhost:5310/test.html), the debug wasm rebuilt into web/pkg on a change under crates/ and the page reloaded (REQ-BUILD-080); `-- --host` for a phone. It shares web/pkg with build:wasm: test, test:site and check swap the release build in, and the pages play it until the next change under crates/"
depends = ["install:site", "install:web"]
raw = true
run = "bash scripts/dev.sh"

[tasks."bench:render"]
description = "The renderer bench: serves bench/render.html for Chrome and Safari (`-- --host` for the network); `-- --headless` runs it once in headless Chromium and prints the table with the load average (REQ-RENDER-010, 050, REQ-BENCH-020)"
depends = ["install:chromium"]
dir = "site"
raw = true
run = "node bench/run.mjs"

[tasks."bench:web"]
description = "Frames and pointer moves in headless Chromium over the release build: every chart, 300 frames panning a 1M-point fixture at 80 × 24 and 320 × 120 against 8 / 16 ms, 300 moves against 0.5 / 2 ms; prints the load average and exits 1 over budget (REQ-PERF-050, 060, REQ-BENCH-020); `-- <type>…` for some charts"
depends = ["build:site", "install:chromium"]
dir = "site"
run = "node bench/web.mjs"

[tasks."bench:load"]
description = "First frame of a one-chart page over the release build, 7 cold loads in headless Chromium: 170 ms / 9 Mbps gated at a 1.0 s median, Lighthouse 12's slow 4G reported (REQ-PERF-080, REQ-BENCH-020)"
depends = ["build:site", "install:chromium"]
dir = "site"
run = "node bench/load.mjs"

[tasks."build:font"]
description = "The bundled font: Iosevka's release subset to web/fonts/glyphplot-mono.woff2 (`-- --check` compares instead)"
run = "uv run --no-project --with 'fonttools[woff]==4.60.1' --with 'brotli==1.2.0' python -I scripts/font.py"

[tasks.fixtures]
description = "Capture the pinned d3 packages' output into crates/glyphplot/tests/fixtures (REQ-REF-010)"
run = ["npm ci --ignore-scripts --prefix scripts/fixtures", "node scripts/fixtures.mjs"]

[tasks.snap]
description = "Rewrite the snapshots of every chart, or of the types given (REQ-SNAP-030)"
usage = 'arg "[type]..." help="chart types; every chart when none"'
run = 'CHART="${usage_type:-}" SNAP=write cargo test -q -p glyphplot --profile contract --test contract every_chart_matches_its_snapshots -- --exact --nocapture'

[tasks.bench]
description = "The native bench: load average, then each type × fixture (1k, 100k, 1M) × grid (80 × 24, 320 × 120), and its 1M pointer move, against budget; exits 1 when a row is OVER (REQ-BENCH-010)"
run = "cargo run -q -p glyphplot --profile contract --example bench --"

[tasks."test:budgets"]
description = "Contract rule 30 alone, its table and load average (REQ-CONTRACT-050); test:rust runs it too"
run = "cargo test -q -p glyphplot --profile contract --test budgets -- --nocapture"

[tasks.build]
description = "Everything check builds: the wasm modules"
depends = ["build:wasm"]

[tasks.fmt]
description = "Format the Rust code (rustfmt.toml)"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt, clippy (host and wasm32, with and without debug), rustdoc, each family alone, tsc on web and site, the octant table, the dependency rules, no generated output in git"
depends = ["install:web", "install:site"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps -p glyphplot",
  "cargo clippy -p glyphplot-wasm --target wasm32-unknown-unknown -- -D warnings",
  "cargo clippy -p glyphplot-wasm --target wasm32-unknown-unknown --features debug -- -D warnings",
  "for f in $(cargo run -q -p glyphplot --example manifest -- families); do cargo check -q -p glyphplot --no-default-features --features $f || exit 1; done",
  "web/node_modules/.bin/tsc --noEmit -p web",
  "web/node_modules/.bin/tsc --noEmit -p site",
  "python3 scripts/octants.py --check",
  "bash scripts/deps.sh",
  "bash scripts/generated.sh",
]

[tasks."test:rust"]
description = "Every Rust test in the workspace, built with the contract profile (optimised, no LTO), the wasm crate's debug parts included"
run = "cargo test --workspace --profile contract --features glyphplot-wasm/debug"

[tasks."test:web"]
description = "The shell's Node tests (web/test/*.test.mjs), against the release build in web/pkg, then the debug build in target/web-debug (REQ-TEST-020); the fixtures rewritten into target/fixtures first. Reads web/pkg, never writes it"
alias = "test:wasm"
depends = ["install:web", "build:wasm", "build:web-debug"]
run = [
  "npm run build --prefix web",
  "rm -rf target/fixtures && cargo run -q --profile contract -p glyphplot --example fixtures -- write target/fixtures",
  "rm -rf target/web-debug/dist && cp -R web/dist target/web-debug/dist",
  "node --test 'web/test/*.test.mjs'",
  "GLYPHPLOT_WEB=target/web-debug node --test 'web/test/*.test.mjs'",
]

[tasks."test:site"]
description = "The browser tests: Playwright in headless Chromium against vite preview of the release build (REQ-E2E-010); `--smoke` runs the smoke set alone (REQ-E2E-070)"
depends = ["build:site", "install:chromium"]
wait_for = ["test:rust"]
dir = "site"
usage = 'flag "--smoke" help="only the smoke set: a first frame, a hover, a drag, a wheel, a key and the axe scans"'
run = 'if [ "${usage_smoke:-false}" = true ]; then npx playwright test --grep @smoke; else npx playwright test; fi'

[tasks."test:site:smoke"]
description = "test:site --smoke, the set check runs (REQ-E2E-070); under signoff (GLYPHPLOT_SIGNOFF=1) all of test:site"
depends = ["build:site", "install:chromium"]
wait_for = ["test:rust"]
dir = "site"
run = 'if [ "${GLYPHPLOT_SIGNOFF:-}" = 1 ]; then npx playwright test; else npx playwright test --grep @smoke; fi'

[tasks.test]
description = "Every test: Rust, the shell's Node tests, and the browser tests' smoke set (all of them under signoff)"
depends = ["test:rust", "test:web", "test:site:smoke"]

[tasks.size]
description = "Each module's wasm and JS, raw and gzip -9, against its budget; WASM_GZ_LIMIT overrides it; `--charts`: each module by owner (REQ-SIZE-050)"
depends = ["build:wasm"]
run = "node scripts/size.mjs"

[tasks.check]
description = "lint, test, build and size: green before every commit"
depends = ["lint", "test", "build", "size"]

[tasks.signoff]
description = "The CI, run locally (REQ-CI-020): each open pull request's head (or the PRs named, `-- 5 6`) checked out under target/ci, npm ci, check (all of test:site), bench:web, bench:load and test:budgets with PROPTEST_CASES=4096, a `signoff` commit status posted; `-- <rev>` checks a local revision and posts nothing; `-- --list` shows the queue"
env = { GLYPHPLOT_SIGNOFF = "1" }
raw = true
run = "bash scripts/signoff.sh"
